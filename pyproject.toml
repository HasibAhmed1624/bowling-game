[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bowling-game-kata"
version = "0.1.0"
description = "Bowling Game Kata — outside-in TDD with a Tkinter demo GUI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-watch>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bowling_game --cov-report=term-missing"

[tool.coverage.run]
source = ["bowling_game"]
omit = [
    "*/gui/app.py",
    "*/gui/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
